<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Canvas LMS Integration for Teams</title>
    <!-- Microsoft Teams SDK & Graph Client -->
    <script src="https://res.cdn.office.net/teams-js/2.19.0/js/MicrosoftTeams.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@microsoft/microsoft-graph-client/lib/graph-js-sdk.js"></script>
    <style>
        :root {
            --canvas-red: #E1261C;
            --canvas-dark: #2D3B45;
            --bg-gray: #F5F7F9;
            --border-color: #C7CDD1;
        }

        * { box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-gray);
            margin: 0;
            padding: 0;
            display: flex;
            direction: rtl;
        }

        /* Canvas Global Sidebar */
        .sidebar {
            width: 85px;
            background-color: var(--canvas-dark);
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding-top: 15px;
            color: white;
            position: fixed;
            right: 0;
            top: 0;
            z-index: 100;
        }
        .sidebar-brand {
            font-weight: bold;
            color: var(--canvas-red);
            font-size: 14px;
            margin-bottom: 25px;
            text-align: center;
        }
        .sidebar-btn {
            background: none;
            border: none;
            color: #C7CDD1;
            padding: 12px 0;
            width: 100%;
            cursor: pointer;
            font-size: 11px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 5px;
        }
        .sidebar-btn.active, .sidebar-btn:hover {
            color: white;
            background-color: rgba(255,255,255,0.1);
            border-right: 4px solid var(--canvas-red);
        }

        /* Main Workspace Layout */
        .workspace {
            margin-right: 85px;
            width: calc(100% - 85px);
            padding: 25px;
            display: grid;
            grid-template-columns: 3fr 1fr;
            gap: 25px;
        }

        .header {
            grid-column: 1 / -1;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .header h1 { margin: 0; font-size: 22px; color: var(--canvas-dark); }

        /* Grid System for Courses Cards */
        .courses-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
            gap: 20px;
            margin-top: 15px;
        }
        .course-card {
            background: white;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            overflow: hidden;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
            transition: transform 0.2s;
        }
        .course-card:hover { transform: translateY(-3px); }
        .course-header {
            height: 90px;
            background: linear-gradient(135deg, #0056b3, #002d62);
            padding: 12px;
            color: white;
            position: relative;
        }
        .course-title { font-weight: bold; font-size: 15px; margin: 0; }
        .course-code { font-size: 12px; opacity: 0.8; }
        .course-body { padding: 15px; font-size: 13px; }

        /* Canvas Style Assignment List */
        .card {
            background: white;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            padding: 15px;
            margin-bottom: 20px;
        }
        .assignment-row {
            border-right: 4px solid var(--canvas-red);
            padding: 12px 15px;
            margin: 10px 0;
            background: #FAFAFA;
            border-radius: 0 4px 4px 0;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .status-tag {
            font-size: 11px;
            padding: 3px 8px;
            border-radius: 10px;
            font-weight: bold;
        }
        .status-pending { background: #FFF3CD; color: #856404; }
        
        /* Loading Spinner */
        .loader {
            border: 3px solid #f3f3f3;
            border-top: 3px solid var(--canvas-red);
            border-radius: 50%;
            width: 24px;
            height: 24px;
            animation: spin 1s linear infinite;
            display: inline-block;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>

    <!-- القائمة الجانبية (Canvas Left Nav) -->
    <div class="sidebar">
        <div class="sidebar-brand">CANVAS<br>TEAMS</div>
        <button class="sidebar-btn active" onclick="switchTab('dashboard')">
            <span>📊</span>
            <span>لوحة التحكم</span>
        </button>
        <button class="sidebar-btn" onclick="switchTab('courses')">
            <span>📚</span>
            <span>الصفوف (All)</span>
        </button>
        <button class="sidebar-btn" onclick="switchTab('assignments')">
            <span>📝</span>
            <span>الواجبات</span>
        </button>
    </div>

    <!-- واجهة العمل الرئيسية -->
    <div class="workspace">
        <div class="header">
            <h1 id="page-title">لوحة التحكم الشاملة (Canvas View)</h1>
            <div id="loading-indicator"><span class="loader"></span> جاري جلب كافة البيانات من Teams...</div>
        </div>

        <!-- المنطقة الممتدة (اليسار) -->
        <div style="grid-column: 1;">
            
            <!-- قسم عرض كافة الصفوف (Courses Section) -->
            <div class="card">
                <h3>جميع الصفوف والمواد (Classes)</h3>
                <div id="courses-container" class="courses-grid">
                    <!-- سيتم توليد الصفوف هنا تلقائياً -->
                </div>
            </div>

            <!-- قسم عرض كل الواجبات (Assignments Section) -->
            <div class="card">
                <h3>كافة الواجبات والمشاريع لكل المواد</h3>
                <div id="all-assignments-container">
                    <!-- سيتم توجيه جميع واجبات كل الصفوف هنا -->
                </div>
            </div>

        </div>

        <!-- الشريط الجانبي الأيمن (To-Do & Calendar) -->
        <div style="grid-column: 2;">
            <div class="card">
                <h4>قائمة المهام القادمة (To-Do)</h4>
                <div id="todo-container" style="font-size: 13px;">
                    <p style="color: #666;">لا توجد مهام معلقة.</p>
                </div>
            </div>
        </div>
    </div>

    <script>
        let graphClient = null;

        // 1. تهيئة برنامج Teams والحصول على الصلاحيات
        microsoftTeams.app.initialize().then(() => {
            microsoftTeams.authentication.getAuthToken().then((token) => {
                // إنشاء العميل للربط مع Graph API
                graphClient = MicrosoftGraph.Client.init({
                    authProvider: (done) => done(null, token)
                });
                
                // جلب كل البيانات فور التشغيل
                loadAllCanvasData();
            }).catch(err => {
                console.warn("تعذر الحصول على التوكن الإداري، استدعاء وضع الاختبار (Demo Mode).");
                renderDemoCanvasData();
            });
        });

        // 2. جلب كل الصفوف والواجبات المبرمجة فيها
        async function loadAllCanvasData() {
            try {
                // أ) جلب جميع الصفوف والمجموعات التعليمية التي ينتمي إليها المستخدم
                const classesResponse = await graphClient.api('/education/classes').get();
                const allClasses = classesResponse.value || [];
                
                renderClasses(allClasses);

                // ب) جلب كافة الواجبات الخاصة بكل الصفوف معاً
                const assignmentsResponse = await graphClient.api('/education/me/assignments').get();
                const allAssignments = assignmentsResponse.value || [];

                renderAssignmentsAndToDo(allAssignments, allClasses);
                document.getElementById('loading-indicator').style.display = 'none';

            } catch (error) {
                console.error("خطأ في جلب البيانات من Graph API:", error);
                renderDemoCanvasData();
            }
        }

        // 3. عرض بطاقات الصفوف (Courses Cards)
        function renderClasses(classes) {
            const container = document.getElementById('courses-container');
            container.innerHTML = '';

            if (classes.length === 0) {
                container.innerHTML = '<p>لم يتم العثور على أي صفوف دراسية مسجلة.</p>';
                return;
            }

            const colors = ['#0056b3', '#28a745', '#17a2b8', '#6f42c1', '#fd7e14'];

            classes.forEach((cls, index) => {
                const color = colors[index % colors.length];
                container.innerHTML += `
                    <div class="course-card">
                        <div class="course-header" style="background: ${color};">
                            <p class="course-title">${cls.displayName}</p>
                            <span class="course-code">${cls.classCode || 'Class ID: ' + cls.id.substring(0,6)}</span>
                        </div>
                        <div class="course-body">
                            <p><strong>الوصف:</strong> ${cls.description || 'صف دراسي على Microsoft Teams'}</p>
                            <p><strong>القسم:</strong> ${cls.term ? cls.term.displayName : 'الفصل الحالي'}</p>
                        </div>
                    </div>
                `;
            });
        }

        // 4. عرض كافة الواجبات وشريط To-Do
        function renderAssignmentsAndToDo(assignments, classes) {
            const assignContainer = document.getElementById('all-assignments-container');
            const todoContainer = document.getElementById('todo-container');
            
            assignContainer.innerHTML = '';
            todoContainer.innerHTML = '';

            if (assignments.length === 0) {
                assignContainer.innerHTML = '<p>🎉 لا توجد واجبات معلقة في أي مادة!</p>';
                return;
            }

            assignments.forEach(assign => {
                const dueDate = new Date(assign.dueDateTime).toLocaleString('ar-EG', { dateStyle: 'medium', timeStyle: 'short' });
                
                // البحث عن اسم الصف التابع له الواجب
                const parentClass = classes.find(c => c.id === assign.classId);
                const className = parentClass ? parentClass.displayName : 'مادة دراسية';

                // إضافة الواجب لقائمة الواجبات الرئيسية
                assignContainer.innerHTML += `
                    <div class="assignment-row">
                        <div>
                            <span style="font-size: 11px; color: #0056b3; font-weight: bold;">[${className}]</span><br>
                            <strong style="font-size: 15px;">${assign.displayName}</strong>
                            <div style="font-size: 12px; color: #666; margin-top: 3px;">تاريخ التسليم: ${dueDate}</div>
                        </div>
                        <div>
                            <span class="status-tag status-pending">مطلوب تسليمه</span>
                        </div>
                    </div>
                `;

                // إضافة الواجب إلى قائمة To-Do الجانبية
                todoContainer.innerHTML += `
                    <div style="margin-bottom: 12px; border-bottom: 1px solid #eee; padding-bottom: 8px;">
                        <a href="${assign.webUrl || '#'}" target="_blank" style="text-decoration:none; color:#333; font-weight:bold;">
                            📌 ${assign.displayName}
                        </a>
                        <div style="font-size: 11px; color: #888;">${className} - ${dueDate}</div>
                    </div>
                `;
            });
        }

        // 5. بيانات توضيحية تجريبية تعمل عند التجربة على المتصفح مباشرة
        function renderDemoCanvasData() {
            document.getElementById('loading-indicator').style.display = 'none';
            
            const demoClasses = [
                { id: '1', displayName: 'برمجة وتطوير شبكات (IT 101)', description: 'مادة البرمجيات والسكربتات', classCode: 'CS-2026' },
                { id: '2', displayName: 'قواعد البيانات والمعلومات (DB 202)', description: 'إدارة نظم SQL و NoSQL', classCode: 'DB-2026' },
                { id: '3', displayName: 'الأمن السيبراني (SEC 301)', description: 'أساسيات الحماية والشبكات', classCode: 'SEC-2026' }
            ];

            const demoAssignments = [
                { id: 'a1', classId: '1', displayName: 'مشروع السكربت الأول (Scripting Project)', dueDateTime: new Date(Date.now() + 86400000*2).toISOString() },
                { id: 'a2', classId: '2', displayName: 'واجب تصميم ERD Diagram', dueDateTime: new Date(Date.now() + 86400000*5).toISOString() },
                { id: 'a3', classId: '3', displayName: 'تقرير اختبار الاختراق الشامل', dueDateTime: new Date(Date.now() + 86400000*8).toISOString() }
            ];

            renderClasses(demoClasses);
            renderAssignmentsAndToDo(demoAssignments, demoClasses);
        }

        function switchTab(tabName) {
            const titleMap = {
                'dashboard': 'لوحة التحكم الشاملة (Canvas View)',
                'courses': 'جميع الصفوف والمواد الدراسية',
                'assignments': 'قائمة الواجبات الكاملة لكل المواد'
            };
            document.getElementById('page-title').innerText = titleMap[tabName] || 'Canvas Teams Dashboard';
        }
    </script>
</body>
</html>
