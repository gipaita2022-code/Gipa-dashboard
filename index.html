<!DOCTYPE html><html lang="ar" dir="rtl"><head>    <meta charset="UTF-8" />    <meta name="viewport" content="width=device-width, initial-scale=1" />    <title>Canvas LMS Integration for Teams</title>    <!-- Microsoft Teams SDK & Graph Client -->    <script src="https://res.cdn.office.net/teams-js/2.19.0/js/MicrosoftTeams.min.js"></script>    <script src="https://cdn.jsdelivr.net/npm/@microsoft/microsoft-graph-client/lib/graph-js-sdk.js"></script>    <style>        :root {            --canvas-red: #E1261C;            --canvas-dark: #2D3B45;            --bg-gray: #F5F7F9;            --border-color: #C7CDD1;        }
        * {            box-sizing: border-box;        }        body {            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;            background-color: var(--bg-gray);            margin: 0;            padding: 0;            display: flex;            direction: rtl;        }
        /* Canvas Global Sidebar */        .sidebar {            width: 85px;            background-color: var(--canvas-dark);            height: 100vh;            display: flex;            flex-direction: column;            align-items: center;            padding-top: 15px;            color: white;            position: fixed;            right: 0;            top: 0;            z-index: 100;        }        .sidebar-brand {            font-weight: bold;            color: var(--canvas-red);            font-size: 14px;            margin-bottom: 25px;            text-align: center;        }        .sidebar-btn {            background: none;            border: none;            color: #C7CDD1;            padding: 12px 0;            width: 100%;            cursor: pointer;            font-size: 11px;            display: flex;            flex-direction: column;            align-items: center;            gap: 5px;        }        .sidebar-btn.active,        .sidebar-btn:hover {            color: white;            background-color: rgba(255, 255, 255, 0.1);            border-right: 4px solid var(--canvas-red);        }
        /* Main Workspace Layout */        .workspace {            margin-right: 85px;            width: calc(100% - 85px);            padding: 25px;            display: grid;            grid-template-columns: 3fr 1fr;            gap: 25px;        }
        .header {            grid-column: 1 / -1;            border-bottom: 1px solid var(--border-color);            padding-bottom: 10px;            display: flex;            justify-content: space-between;            align-items: center;        }        .header h1 {            margin: 0;            font-size: 22px;            color: var(--canvas-dark);        }
        /* Grid System for Cards */        .courses-grid {            display: grid;            grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));            gap: 20px;            margin-top: 15px;        }        .course-card {            background: white;            border: 1px solid var(--border-color);            border-radius: 6px;            overflow: hidden;            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.05);            transition: transform 0.2s;        }        .course-card:hover {            transform: translateY(-3px);        }        .course-header {            height: 90px;            background: linear-gradient(135deg, #0056b3, #002d62);            padding: 12px;            color: white;            position: relative;        }        .course-title {            font-weight: bold;            font-size: 15px;            margin: 0;        }        .course-code {            font-size: 12px;            opacity: 0.8;        }        .course-body {            padding: 15px;            font-size: 13px;        }
        /* Assignment List */        .card {            background: white;            border: 1px solid var(--border-color);            border-radius: 6px;            padding: 15px;            margin-bottom: 20px;        }        .assignment-row {            border-right: 4px solid var(--canvas-red);            padding: 12px 15px;            margin: 10px 0;            background: #FAFAFA;            border-radius: 0 4px 4px 0;            display: flex;            justify-content: space-between;            align-items: center;        }        .status-tag {            font-size: 11px;            padding: 3px 8px;            border-radius: 10px;            font-weight: bold;        }        .status-pending {            background: #FFF3CD;            color: #856404;        }
        /* Loading Spinner */        .loader {            border: 3px solid #f3f3f3;            border-top: 3px solid var(--canvas-red);            border-radius: 50%;            width: 24px;            height: 24px;            animation: spin 1s linear infinite;            display: inline-block;        }        @keyframes spin {            0% {                transform: rotate(0deg);            }            100% {                transform: rotate(360deg);            }        }
        /* Grade - Subject - Teacher List */        .grades-container {            margin-top: 15px;        }        .grade-card {            background: white;            border: 1px solid var(--border-color);            border-radius: 6px;            padding: 15px;            margin-bottom: 20px;        }        .grade-title {            font-weight: bold;            font-size: 18px;            margin-bottom: 10px;            color: var(--canvas-red);        }        .subject-list {            list-style: none;            padding: 0;            margin: 0;        }        .subject-list li {            padding: 6px 10px;            border-bottom: 1px solid #eee;        }        .subject-list li:last-child {            border-bottom: none;        }        .subject-name {            font-weight: bold;        }        .teacher-name {            font-style: italic;            color: #555;            margin-right: 10px;        }    </style></head><body>    <!-- Sidebar -->    <div class="sidebar">        <div class="sidebar-brand">CANVAS<br />TEAMS</div>        <button class="sidebar-btn active" onclick="switchTab('dashboard')">            <span>📊</span>            <span>لوحة التحكم</span>        </button>        <button class="sidebar-btn" onclick="switchTab('courses')">            <span>📚</span>            <span>الصفوف (All)</span>        </button>        <button class="sidebar-btn" onclick="switchTab('assignments')">            <span>📝</span>            <span>الواجبات</span>        </button>        <button class="sidebar-btn" onclick="switchTab('grades')">            <span>🏫</span>            <span>الصفوف حسب المراحل</span>        </button>    </div>
    <!-- Workspace -->    <div class="workspace">        <div class="header">            <h1 id="page-title">لوحة التحكم الشاملة (Canvas View)</h1>            <div id="loading-indicator"><span class="loader"></span> جاري جلب كافة البيانات من Teams...</div>        </div>
        <!-- Main Content Left -->        <div style="grid-column: 1;">            <!-- Courses Section -->            <div id="courses-section" class="card">                <h3>جميع الصفوف والمواد (Classes)</h3>                <div id="courses-container" class="courses-grid"></div>            </div>
            <!-- Assignments Section -->            <div id="assignments-section" class="card" style="display:none;">                <h3>كافة الواجبات والمشاريع لكل المواد</h3>                <div id="all-assignments-container"></div>            </div>
            <!-- Grades Section -->            <div id="grades-section" class="card" style="display:none;">                <h3>الصفوف حسب المراحل مع المواد والمعلمين</h3>                <div id="grades-container" class="grades-container"></div>            </div>        </div>
        <!-- Sidebar To-Do -->        <div style="grid-column: 2;">            <div class="card">                <h4>قائمة المهام القادمة (To-Do)</h4>                <div id="todo-container" style="font-size: 13px;">                    <p style="color: #666;">لا توجد مهام معلقة.</p>                </div>            </div>        </div>    </div>
    <script>        let graphClient = null;
        // Data structure for grades, subjects, and teachers        const gradesData = [            {                gradeName: "الصف السادس",                subjects: [                    { name: "الرياضيات", teacher: "أ. أحمد علي" },                    { name: "اللغة العربية", teacher: "أ. فاطمة حسين" },                    { name: "العلوم", teacher: "أ. محمد سالم" }                ]            },            {                gradeName: "الصف السابع",                subjects: [                    { name: "الرياضيات", teacher: "أ. أحمد علي" },                    { name: "اللغة الإنجليزية", teacher: "أ. سارة جمال" },                    { name: "التاريخ", teacher: "أ. خالد محمود" }                ]            },            {                gradeName: "الصف الثامن",                subjects: [                    { name: "الفيزياء", teacher: "أ. ليلى مصطفى" },                    { name: "الكيمياء", teacher: "أ. هاني يوسف" },                    { name: "الجغرافيا", teacher: "أ. منى سعيد" }                ]            },            // Add more grades as needed        ];
        // 1. Initialize Microsoft Teams and get token        microsoftTeams.app.initialize().then(() => {            microsoftTeams.authentication.getAuthToken().then((token) => {                graphClient = MicrosoftGraph.Client.init({                    authProvider: (done) => done(null, token)                });                loadAllCanvasData();            }).catch(err => {                console.warn("تعذر الحصول على التوكن الإداري، استدعاء وضع الاختبار (Demo Mode).");                renderDemoCanvasData();            });        });
        // 2. Load all classes and assignments        async function loadAllCanvasData() {            try {                const classesResponse = await graphClient.api('/education/classes').get();                const allClasses = classesResponse.value || [];                renderClasses(allClasses);
                const assignmentsResponse = await graphClient.api('/education/me/assignments').get();                const allAssignments = assignmentsResponse.value || [];                renderAssignmentsAndToDo(allAssignments, allClasses);
                document.getElementById('loading-indicator').style.display = 'none';
                // Render grades data                renderGrades(gradesData);            } catch (error) {                console.error("خطأ في جلب البيانات من Graph API:", error);                renderDemoCanvasData();            }        }
        // Render classes cards        function renderClasses(classes) {            const container = document.getElementById('courses-container');            container.innerHTML = '';
            if (classes.length === 0) {                container.innerHTML = '<p>لم يتم العثور على أي صفوف دراسية مسجلة.</p>';                return;            }
            const colors = ['#0056b3', '#28a745', '#17a2b8', '#6f42c1', '#fd7e14'];
            classes.forEach((cls, index) => {                const color = colors[index % colors.length];                container.innerHTML += `                    <div class="course-card">                        <div class="course-header" style="background: ${color};">                            <p class="course-title">${cls.displayName}</p>                            <span class="course-code">${cls.classCode || 'Class ID: ' + cls.id.substring(0, 6)}</span>                        </div>                        <div class="course-body">                            <p><strong>الوصف:</strong> ${cls.description || 'صف دراسي على Microsoft Teams'}</p>                            <p><strong>القسم:</strong> ${cls.term ? cls.term.displayName : 'الفصل الحالي'}</p>                        </div>                    </div>                `;            });        }
        // Render assignments and to-do list        function renderAssignmentsAndToDo(assignments, classes) {            const assignContainer = document.getElementById('all-assignments-container');            const todoContainer = document.getElementById('todo-container');
            assignContainer.innerHTML = '';            todoContainer.innerHTML = '';
            if (assignments.length === 0) {                assignContainer.innerHTML = '<p>🎉 لا توجد واجبات معلقة في أي مادة!</p>';                todoContainer.innerHTML = '<p style="color: #666;">لا توجد مهام معلقة.</p>';                return;            }
            assignments.forEach(assign => {                const dueDate = new Date(assign.dueDateTime).toLocaleString('ar-EG', { dateStyle: 'medium', timeStyle: 'short' });                const parentClass = classes.find(c => c.id === assign.classId);                const className = parentClass ? parentClass.displayName : 'مادة دراسية';
                assignContainer.innerHTML += `                    <div class="assignment-row">                        <div>                            <span style="font-size: 11px; color: #0056b3; font-weight: bold;">[${className}]</span><br>                            <strong style="font-size: 15px;">${assign.displayName}</strong>                            <div style="font-size: 12px; color: #666; margin-top: 3px;">تاريخ التسليم: ${dueDate}</div>                        </div>                        <
